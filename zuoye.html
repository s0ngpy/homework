<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>光的反射 · 课后练习</title>
<style>
:root{
  --ink:#182b3f; --ink2:#5c6f83; --ink3:#8b9aab;
  --bg:#f3f8ff; --card:#ffffff;
  --line:#e5eefa; --line2:#d6e4f5;
  --primary:#2f7cf6; --primary-d:#1f63d6; --teal:#33c7b0; --accent:#ffb020;
  --good:#12b886; --bad:#f2545b;
  --shadow:0 12px 34px rgba(31,72,140,.10);
  --shadow-l:0 22px 54px rgba(31,72,140,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 600px at 8% -10%,#dfeeff 0%,rgba(223,238,255,0) 60%),
    radial-gradient(800px 620px at 100% 0%,#e2f8f4 0%,rgba(226,248,244,0) 62%),
    radial-gradient(700px 520px at 50% 110%,#eee8ff 0%,rgba(238,232,255,0) 60%),
    #f6faff;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(47,124,246,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(47,124,246,.045) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(circle at 50% 20%,#000 0%,transparent 72%);
  -webkit-mask-image:radial-gradient(circle at 50% 20%,#000 0%,transparent 72%);
}
.screen{display:none;position:relative;z-index:1}
.screen.show{display:block;animation:fadeUp .42s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ============ 登录页 ============ */
.login-wrap{max-width:1120px;margin:0 auto;padding:44px 24px 40px;display:flex;gap:26px;align-items:center;min-height:100vh}
.login-card{flex:1 1 620px;max-width:660px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);
  border:1px solid #fff;border-radius:28px;padding:34px 38px 30px;box-shadow:var(--shadow-l)}
.brand{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--primary);
  background:#edf5ff;border:1px solid #dbeaff;padding:6px 12px;border-radius:99px;letter-spacing:.4px;font-weight:600}
.brand i{width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px rgba(47,124,246,.18)}
h1{font-size:38px;margin:16px 0 8px;letter-spacing:-.5px;line-height:1.2}
h1 .h1-sub{font-size:17px;color:var(--ink3);font-weight:500;margin-left:10px;letter-spacing:0}
.lead{margin:0 0 22px;color:var(--ink2);font-size:14.5px;line-height:1.75;max-width:520px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
.field{display:block}
.field span{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:7px;font-weight:600;letter-spacing:.3px}
.field input{width:100%;padding:12px 14px;font-size:15px;color:var(--ink);background:#f7fbff;
  border:1.5px solid var(--line2);border-radius:12px;outline:none;transition:.18s;font-family:inherit}
.field input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(47,124,246,.12)}
.field input::placeholder{color:#a9b8c8}
.field.err input{border-color:var(--bad);background:#fff6f6}
.sect-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sect-title b{font-size:13px;letter-spacing:.6px;color:var(--ink2)}
.sect-title em{font-style:normal;font-size:12px;color:var(--ink3)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.level-card{position:relative;text-align:left;padding:16px 15px 15px;border-radius:17px;cursor:pointer;
  border:1.5px solid var(--line);background:#fff;transition:.2s cubic-bezier(.2,.8,.2,1);font-family:inherit;overflow:hidden}
.level-card:before{content:"";position:absolute;inset:0;opacity:0;transition:.2s;
  background:linear-gradient(160deg,rgba(47,124,246,.09),rgba(51,199,176,.07))}
.level-card:hover{transform:translateY(-4px);border-color:#bcd8ff;box-shadow:0 14px 26px rgba(31,72,140,.12)}
.level-card:hover:before{opacity:1}
.level-card .lv-top{position:relative;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.level-card .lv-name{font-size:16px;font-weight:700;letter-spacing:.5px}
.level-card .stars{font-size:11px;color:var(--accent);letter-spacing:1px}
.level-card .lv-desc{position:relative;font-size:12px;color:var(--ink2);line-height:1.6;min-height:38px}
.level-card .lv-foot{position:relative;margin-top:10px;font-size:11.5px;color:var(--ink3);display:flex;gap:8px;align-items:center}
.dot-sep{width:3px;height:3px;border-radius:50%;background:#cbd8e6;display:inline-block}
.hint-line{margin:18px 0 0;font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.hint-line b{color:var(--primary);font-weight:600}

/* 登录页人物 */
.login-hero{position:relative;flex:0 0 312px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:10px}
.login-hero .hero-img{width:266px;position:relative;z-index:2;filter:drop-shadow(0 22px 28px rgba(31,72,140,.18));animation:floaty 4.2s ease-in-out infinite}
.login-hero .ground{position:absolute;bottom:2px;width:200px;height:22px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(47,124,246,.22),rgba(47,124,246,0) 70%)}
.hero-bubble{position:relative;z-index:3;background:#fff;border-radius:18px;margin-bottom:-8px;
  padding:13px 15px;font-size:13px;line-height:1.7;color:var(--ink2);width:224px;text-align:center;
  box-shadow:var(--shadow);border:1px solid var(--line)}
.hero-bubble:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;width:13px;height:13px;
  background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.hero-bubble b{color:var(--primary)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

/* ============ 答题页 ============ */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:12px 22px 0}
.tb-row{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-bottom:11px}
.tb-title{font-size:15px;font-weight:700;letter-spacing:.3px}
.tb-title span{color:var(--primary)}
.tb-meta{font-size:12px;color:var(--ink3);margin-top:2px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{font-size:12.5px;color:var(--ink2);background:#f2f8ff;border:1px solid var(--line);border-radius:99px;padding:6px 12px;white-space:nowrap}
.pill b{color:var(--primary)}
.progress{height:3px;background:transparent;max-width:900px;margin:0 auto;position:relative;overflow:hidden}
.progress i{position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--teal));
  transition:width .45s cubic-bezier(.2,.8,.2,1)}
.quiz-main{max-width:900px;margin:0 auto;padding:20px 22px 190px}
.dots{display:flex;gap:8px;margin-bottom:14px}
.dot{width:30px;height:30px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;color:var(--ink3);
  font-size:12.5px;font-weight:600;cursor:pointer;transition:.18s;font-family:inherit}
.dot.done{background:#eafaf5;border-color:#b6ebdc;color:#0e9c74}
.dot.cur{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 14px rgba(47,124,246,.28)}
.dot:hover{transform:translateY(-2px)}
.qcard{background:#fff;border-radius:22px;padding:26px 28px 24px;box-shadow:var(--shadow);border:1px solid #eef4fc;position:relative;overflow:hidden}
.qcard:before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:linear-gradient(90deg,#8bbcff,#4fd6c4)}
.q-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.badge{font-size:11.5px;font-weight:700;letter-spacing:.6px;padding:4px 9px;border-radius:7px;background:#eef5ff;color:var(--primary)}
.badge.judge{background:#fff6e8;color:#c8850c}
.badge.fill{background:#effaf7;color:#0e9c74}
.q-no{font-size:12px;color:var(--ink3);margin-left:auto;font-variant-numeric:tabular-nums}
.q-stem{font-size:17.5px;line-height:1.85;font-weight:600;letter-spacing:.2px}
.q-stem .blk{display:inline-block;min-width:78px;border-bottom:2px solid #cfe0f5;margin:0 4px}
.q-fig{margin:16px 0 4px;background:#f8fbff;border:1px dashed #d9e7f8;border-radius:14px;padding:6px 8px 2px}
.q-fig svg{width:100%;max-width:448px;height:auto;display:block;margin:0 auto}
.opts{margin-top:18px;display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1.5px solid var(--line);border-radius:13px;
  background:#fbfdff;cursor:pointer;transition:.16s;font-size:15px;line-height:1.5}
.opt:hover{border-color:#c2dafb;background:#f7fbff;transform:translateX(2px)}
.opt input{display:none}
.opt .opt-key{flex:0 0 26px;height:26px;border-radius:8px;background:#eef4fc;color:var(--ink2);
  display:grid;place-items:center;font-size:13px;font-weight:700;transition:.16s}
.opt.sel{border-color:var(--primary);background:#f0f7ff;box-shadow:0 4px 14px rgba(47,124,246,.12)}
.opt.sel .opt-key{background:var(--primary);color:#fff}
.opt.ok{border-color:#7fd9be;background:#f0fcf8}
.opt.ok .opt-key{background:var(--good);color:#fff}
.opt.no{border-color:#f7b4b8;background:#fff5f5}
.opt.no .opt-key{background:var(--bad);color:#fff}
.opts.judge{flex-direction:row}
.opts.judge .opt{flex:1;justify-content:center}
.opts.judge .opt-key{font-size:16px}
.fillrow{margin-top:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fill-in{flex:1;min-width:200px;max-width:360px;padding:13px 16px;font-size:17px;font-family:inherit;color:var(--ink);
  background:#f7fbff;border:1.5px solid var(--line2);border-radius:12px;outline:none;transition:.18s;letter-spacing:.5px}
.fill-in:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(47,124,246,.12)}
.fill-in.ok{border-color:#7fd9be;background:#f3fdfa}
.fill-in.no{border-color:#f7b4b8;background:#fff7f7}
.unit{font-size:16px;color:var(--ink2);font-weight:600}
.fb{margin-top:16px;padding:12px 15px;border-radius:12px;font-size:13.5px;line-height:1.7;display:flex;gap:9px;animation:fadeUp .3s}
.fb.ok{background:#f0fcf8;border:1px solid #c9f0e2;color:#0b7f60}
.fb.no{background:#fff6f6;border:1px solid #fbdcde;color:#b83b42}
.fb .fb-i{font-size:15px;line-height:1.4}
.fb b{font-weight:700}
.qnav{display:flex;align-items:center;gap:10px;margin-top:18px}
.qnav .spacer{flex:1}
.btn{font-family:inherit;font-size:14px;font-weight:600;border-radius:12px;padding:11px 20px;cursor:pointer;transition:.18s;border:1.5px solid transparent;letter-spacing:.3px}
.btn:active{transform:scale(.97)}
.primary-btn{background:linear-gradient(135deg,var(--primary),#4a93ff);color:#fff;box-shadow:0 8px 20px rgba(47,124,246,.28)}
.primary-btn:hover{box-shadow:0 12px 26px rgba(47,124,246,.36);transform:translateY(-1px)}
.soft-btn{background:#eef5ff;color:var(--primary-d);border-color:#d9e8ff}
.soft-btn:hover{background:#e4efff}
.ghost-btn{background:#fff;color:var(--ink2);border-color:var(--line2)}
.ghost-btn:hover{background:#f7fbff;border-color:#c3d8f2}

/* ============ 结果页 ============ */
.result-wrap{max-width:900px;margin:0 auto;padding:34px 22px 200px}
.res-card{background:#fff;border-radius:24px;padding:30px;box-shadow:var(--shadow);border:1px solid #eef4fc}
.res-top{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.ring-wrap{position:relative;width:132px;height:132px;flex:0 0 132px}
.ring{width:132px;height:132px;display:block}
.ring-txt{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-txt b{font-size:32px;line-height:1;letter-spacing:-1px}
.ring-txt span{font-size:11px;color:var(--ink3);margin-top:4px;display:block}
.res-info{flex:1;min-width:220px}
.res-info h2{margin:0 0 6px;font-size:24px;letter-spacing:-.3px}
.res-info p{margin:0;color:var(--ink2);font-size:13.5px;line-height:1.7}
.res-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:12px;padding:5px 11px;border-radius:99px;background:#f2f8ff;color:var(--ink2);border:1px solid var(--line)}
.tag.g{background:#effaf5;color:#0e9c74;border-color:#cdf0e3}
.tag.r{background:#fff5f5;color:#c1444b;border-color:#fbdcde}
.review{margin-top:22px}
.rv-item{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:#fcfdff}
.rv-item.ok{border-color:#d3f0e6;background:#fbfefd}
.rv-item.no{border-color:#fbe0e2;background:#fffcfc}
.rv-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin-bottom:6px}
.rv-h .st{font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px}
.rv-h .st.ok{background:#e6f9f1;color:#0b7f60}
.rv-h .st.no{background:#ffecec;color:#b83b42}
.rv-stem{font-size:14px;line-height:1.7;color:var(--ink);font-weight:600;margin-bottom:6px}
.rv-ans{font-size:13px;line-height:1.8;color:var(--ink2)}
.rv-ans b{color:var(--ink)}
.rv-exp{margin-top:6px;font-size:12.5px;line-height:1.75;color:#4a5f77;background:#f6faff;border-radius:9px;padding:9px 11px}
.res-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center}
.upload-state{font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:7px;margin-left:auto}
.upload-state .dot-s{width:7px;height:7px;border-radius:50%;background:#c9d6e4}
.upload-state.ok .dot-s{background:var(--good);box-shadow:0 0 0 3px rgba(18,184,134,.16)}
.upload-state.err .dot-s{background:var(--bad);box-shadow:0 0 0 3px rgba(242,84,91,.16)}

/* ============ AI 助教 ============ */
#tutorDock{position:fixed;right:16px;bottom:0;width:128px;z-index:31;cursor:pointer;user-select:none;display:none;
  transition:transform .25s cubic-bezier(.2,.8,.2,1)}
#tutorDock:hover{transform:translateY(-6px)}
#tutorDock img{position:relative;z-index:1;width:100%;display:block;filter:drop-shadow(0 10px 16px rgba(31,72,140,.20));animation:floaty 4.6s ease-in-out infinite}
#tutorDock .t-shadow{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:80px;height:14px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(31,72,140,.20),rgba(31,72,140,0) 70%)}
.tutor-bubble{position:absolute;z-index:6;right:124px;bottom:238px;width:196px;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:11px 13px;font-size:12.5px;line-height:1.6;color:var(--ink2);
  box-shadow:0 12px 26px rgba(31,72,140,.14);opacity:0;transform:translateY(8px) scale(.96);pointer-events:none;
  transition:.26s cubic-bezier(.2,.8,.2,1)}
.tutor-bubble:after{content:"";position:absolute;right:-6px;bottom:26px;width:11px;height:11px;background:#fff;
  border-top:1px solid var(--line);border-right:1px solid var(--line);transform:rotate(45deg)}
.tutor-bubble.show{opacity:1;transform:none}
.tutor-bubble b{color:var(--primary)}
.badge-dot{position:absolute;right:6px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--bad);
  border:2px solid #fff;font-size:9px;color:#fff;display:none;place-items:center;font-weight:700;line-height:1}
.badge-dot.show{display:grid}

.chat-panel{position:fixed;right:152px;bottom:22px;width:346px;height:492px;background:#fff;border-radius:20px;
  box-shadow:0 26px 60px rgba(20,50,100,.22);border:1px solid #edf3fb;display:flex;flex-direction:column;overflow:hidden;
  z-index:40;opacity:0;transform:translateY(14px) scale(.96);pointer-events:none;transition:.26s cubic-bezier(.2,.8,.2,1);transform-origin:bottom right}
.chat-panel.open{opacity:1;transform:none;pointer-events:auto}
/* 聊天打开时为内容让出空间，避免遮挡按钮 */
.quiz-main,.result-wrap{transition:padding-right .3s cubic-bezier(.2,.8,.2,1)}
@media(min-width:901px){
  body.chat-open .quiz-main,body.chat-open .result-wrap{padding-right:390px}
}
@media(min-width:1251px){
  body.chat-open .quiz-main,body.chat-open .result-wrap{padding-right:342px}
}
@media(max-width:1150px) and (min-width:901px){
  .chat-panel{width:300px;right:10px}
  #tutorDock{width:104px;right:8px}
  .tutor-bubble{right:98px}
}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#f7fbff,#fff)}
.chat-head img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #e8f2ff;background:#f5faff}
.chat-head b{display:block;font-size:13.5px;line-height:1.3}
.chat-head span{font-size:11px;color:var(--ink3)}
.chat-head .live{color:#0e9c74}
.chat-head button{margin-left:auto;background:none;border:none;font-size:15px;color:var(--ink3);cursor:pointer;padding:4px 6px;border-radius:8px}
.chat-head button:hover{background:#f1f6fd;color:var(--ink)}
.chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:11px;background:#fcfdff}
.chat-body::-webkit-scrollbar{width:5px}
.chat-body::-webkit-scrollbar-thumb{background:#dbe7f5;border-radius:9px}
.msg{display:flex;gap:8px;max-width:88%;animation:fadeUp .28s}
.msg .av{flex:0 0 26px;width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid #eaf3ff;background:#f7fbff}
.msg .bub{padding:9px 12px;border-radius:13px;font-size:13px;line-height:1.7;background:#fff;border:1px solid #edf3fb;color:var(--ink)}
.msg .bub b{color:var(--primary-d)}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:linear-gradient(135deg,var(--primary),#5c9cff);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(47,124,246,.22)}
.msg.me .av{display:none}
.typing .bub{display:flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:#b8cbe3;animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}
@keyframes blink{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chips{display:flex;gap:6px;padding:9px 12px 3px;flex-wrap:wrap;background:#fff;border-top:1px solid #f2f7fd}
.chip{font-family:inherit;font-size:12px;color:var(--primary-d);background:#eff6ff;border:1px solid #dcebff;
  border-radius:99px;padding:6px 11px;cursor:pointer;transition:.16s;white-space:nowrap}
.chip:hover{background:#e2efff;transform:translateY(-1px)}
.chat-input{display:flex;gap:8px;padding:10px 12px 12px;background:#fff}
.chat-input input{flex:1;font-family:inherit;font-size:13px;padding:10px 13px;border:1.5px solid var(--line2);
  border-radius:11px;outline:none;background:#f8fbff;color:var(--ink);transition:.16s}
.chat-input input:focus{border-color:var(--primary);background:#fff}
.chat-input button{font-family:inherit;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--primary),#4a93ff);
  border:none;border-radius:11px;padding:0 15px;cursor:pointer;transition:.16s}
.chat-input button:hover{filter:brightness(1.05)}
.chat-input button:active{transform:scale(.96)}

/* toast */
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:rgba(24,43,63,.92);color:#fff;
  font-size:13px;padding:11px 18px;border-radius:12px;z-index:90;opacity:0;pointer-events:none;transition:.28s;backdrop-filter:blur(6px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:900px){
  .login-wrap{flex-direction:column-reverse;padding:26px 16px 30px;min-height:auto;gap:0}
  .login-hero{flex:0 0 auto;width:100%;flex-direction:row;align-items:center;justify-content:center;gap:8px;padding:4px 0 12px}
  .login-hero .hero-img{width:108px}
  .login-hero .ground{display:none}

let figSeq = 0;
function arcPts(cx,cy,r,a1,a2,steps){
  const p=[];
  for(let i=0;i<=steps;i++){
    const t=(a1+(a2-a1)*i/steps)*Math.PI/180;
    p.push([(cx+r*Math.sin(t)).toFixed(1),(cy-r*Math.cos(t)).toFixed(1)]);
  }
  return 'M'+p.map(q=>q.join(' ')).join(' L');
}

  const ex=(O.x+L*Math.sin(rad)).toFixed(1);
  // 镜面斜线
  let hatch='';
  for(let x=70;x<=330;x+=16){ hatch+=`M${x} 156 L${x-9} 168 `; }
  const labR = 46, midPhi = awm/2, lxp=(O.x-56*Math.cos(midPhi*Math.PI/180)).toFixed(1), lyp=(O.y-56*Math.sin(midPhi*Math.PI/180)).toFixed(1);
  return `<svg viewBox="0 0 400 230" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="${id}" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
        <path d="M0,0 L7,3 L0,6 z" fill="#2f7cf6"/>
      </marker>
      <linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#9fb6cf"/><stop offset="1" stop-color="#6f8aa8"/>
      </linearGradient>
    </defs>
    <path d="${hatch}" stroke="#c2d3e6" stroke-width="1.6" fill="none"/>
    <line x1="62" y1="156" x2="338" y2="156" stroke="url(#${id}g)" stroke-width="4" stroke-linecap="round"/>
    <line x1="${O.x}" y1="156" x2="${O.x}" y2="34" stroke="#a9bdd3" stroke-width="1.8" stroke-dasharray="6 5"/>
    <line x1="${ix}" y1="${iy}" x2="${O.x}" y2="${O.y}" stroke="#2f7cf6" stroke-width="2.6" marker-end="url(#${id})"/>
    <line x1="${O.x}" y1="${O.y}" x2="${ex}" y2="${iy}" stroke="#e2564f" stroke-width="2.6" marker-end="url(#${id})"/>
    <circle cx="${O.x}" cy="${O.y}" r="4.2" fill="#1f63d6"/>
    <path d="${arcPts(O.x,O.y,labR,-a,0,16)}" fill="none" stroke="#2f7cf6" stroke-width="1.6" opacity=".75"/>
    <path d="${arcPts(O.x,O.y,labR,0,a,16)}" fill="none" stroke="#e2564f" stroke-width="1.6" opacity=".75"/>
    <path d="${arcPts(O.x,O.y,74,-90,-a,14)}" fill="none" stroke="#8a9bb0" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="${O.x-8}" y="46" font-size="12" fill="#7d8fa4" text-anchor="middle">法线</text>
    <text x="316" y="180" font-size="12" fill="#6f8aa8">镜面</text>
    <text x="${ix}" y="${(+iy)-12}" font-size="12.5" fill="#2f7cf6" text-anchor="end">入射光线</text>
    <text x="${ex}" y="${(+iy)-12}" font-size="12.5" fill="#e2564f" text-anchor="start">反射光线</text>

  </svg>`;
}

function fmtClock(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function fmtTime(d){
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}

/* 归一化（全角转半角、去空格标点、去单位） */
function norm(s){
  return String(s==null?'':s)
    .replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248))
    .replace(/\u3000/g,'')
    .replace(/\s+/g,'')
    .replace(/[。．.，,；;、"'“”‘’（）()\[\]【】]/g,'')
    .replace(/[°度]/g,'')
    .toLowerCase();
}
function grade(q,val){
  if(val===undefined||val===null||val==='') return false;
  if(q.type==='choice') return val===q.answer;
  if(q.type==='judge')  return val===q.answer;
  const nv=norm(val);
  if(!nv) return false;
  return q.answers.some(a=>{
    const na=norm(a);
    if(na===nv) return true;
    const x=parseFloat(nv), y=parseFloat(na);
    return !isNaN(x)&&!isNaN(y)&&Math.abs(x-y)<1e-6;
  });
}
function ansOf(q){
  const k=state.level+':'+q.id;
  if(!state.ans[k]) state.ans[k]={value:null,checked:null,attempts:0,hints:0,sec:0,startTs:Date.now()};
  return state.ans[k];
}
function ansText(q,val){
  if(val===undefined||val===null||val==='') return '未作答';
  if(q.type==='choice') return 'ABCD'[val]+'. '+q.options[val];
  if(q.type==='judge')  return val?'正确':'错误';
  return String(val)+(q.unit||'');
}
function correctText(q){
  if(q.type==='choice') return 'ABCD'[q.answer]+'. '+q.options[q.answer];
  if(q.type==='judge')  return q.answer?'正确':'错误';
  return q.answers[0]+(q.unit||'');
}

    fb = st.checked
      ? `<div class="fb ok"><span class="fb-i">✅</span><div><b>答对了！</b>${esc(q.tip)}</div></div>`
      : `<div class="fb no"><span class="fb-i">❌</span><div><b>还差一点。</b>${esc(q.hint)}</div></div>`;
  }
  const figHtml = q.fig? `<div class="q-fig">${figSVG(q.fig.awm)}</div>`:'';

  $('#qcard').innerHTML=`
    <div class="q-head">
      <span class="badge ${q.type}">${TYPE_NAME[q.type]}</span>
      <span class="q-no">第 ${state.idx+1} / 5 题</span>
    </div>
    <div class="q-stem">${esc(q.stem).replace(/［　　］/g,'<span class="blk"></span>')}</div>
    ${figHtml}
    ${body}
    ${fb}`;

  if(q.type==='fill'){
    const inp=$('#fillIn');
    inp.addEventListener('input',()=>{
      const s=ansOf(q); s.value=inp.value; s.checked=null;
      inp.classList.remove('ok','no'); updateProgress(); renderDots();
      const f=$('#qcard .fb'); if(f) f.remove();
    });
    inp.addEventListener('focus',()=>{ if(window.innerWidth>760) return; });
  }
  updateProgress();
  renderDots();
  $('#btnPrev').disabled=state.idx===0;
  $('#btnPrev').style.opacity=state.idx===0?.45:1;
  $('#btnNext').textContent = state.idx===4 ? '提交作业' : '下一题';
  if(state.idx===4) $('#btnNext').classList.add('primary-btn');
}
function setCaretEnd(el){
  const v=el.value; el.value=''; el.value=v;
  el.focus({preventScroll:true}); el.setSelectionRange(v.length,v.length);
}
function updateProgress(){
  const lv=BANK[state.level];
  const done=lv.qs.filter(q=>{const s=ansOf(q);return s.value!==null&&s.value!=='';}).length;
  $('#doneCount').textContent=done;
  $('#progFill').style.width=(done/5*100)+'%';
}

/* 选项点击 */
$('#qcard').addEventListener('click',e=>{
  const opt=e.target.closest('.opt'); if(!opt) return;
  const q=BANK[state.level].qs[state.idx], st=ansOf(q);
  if(opt.dataset.v!==undefined){
    st.value = opt.dataset.v==='1';
  } else {
    st.value = +opt.dataset.i;
  }
  st.checked=null;
  renderQuestion();
  updateProgress();
});

/* ======================= 判题 ======================= */
function checkCurrent(silent){
  const q=BANK[state.level].qs[state.idx], st=ansOf(q);
  if(st.value===null||st.value===''){
    if(!silent){ bubble('先写下你的答案，我才能帮你看看呀～',4200); }
    return null;
  }
  st.attempts++;
  const ok=grade(q,st.value);
  st.checked=ok;
  renderQuestion(); updateProgress();
  if(ok){
    bubble(pick(['这题对了，思路很稳！✨','漂亮，抓到关键了 👍']),4000);
    return {ok,msg:okMsg(q)};
  }
  bubble('差一点点，看看红框里的提示～',4600);
  return {ok,msg:badMsg(q,st.value)};
}
function okMsg(q){
  return `✅ 这题<b>对了</b>！${esc(q.tip)}<br><span style="color:#8b9aab;font-size:12px">想听详细解析也可以点"讲讲思路"。</span>`;
}
function badMsg(q,val){
  return `❌ 这题<b>还不对</b>。你现在写的是「${esc(ansText(q,val))}」。<br>给你个提示：${esc(q.hint)}<br><span style="color:#8b9aab;font-size:12px">再试一次，或者点"讲讲思路"我直接讲。</span>`;
}

/* ======================= 上一题 / 下一题 / 提交 ======================= */
$('#btnPrev').onclick=()=>{ if(state.idx>0){state.idx--;renderQuestion();} };
$('#btnNext').onclick=()=>{
  const q=BANK[state.level].qs[state.idx], st=ansOf(q);
  if(st.value===null||st.value===''){
    toast('这题还没作答，先选一个答案吧');
    return;
  }
  if(state.idx<4){ state.idx++; renderQuestion(); }
  else { submitHomework(); }
};
$('#btnCheck').onclick=()=>{
  const r=checkCurrent(false);
  if(r){ openChat(true); addMsg('ai',r.msg); }
};
$('#dots').addEventListener('click',e=>{
  const d=e.target.closest('.dot'); if(!d) return;
  state.idx=+d.dataset.i; renderQuestion();
});
$('#btnQuit').onclick=()=>{
  if(confirm('退出后本次答题不会记录，确定要退出吗？')){
    clearInterval(clockTimer); state.startedAt=null;
    closeChat(); showScreen('screen-login');
  }
};

/* ======================= 提交与上传 ======================= */
function submitHomework(){
  const lv=BANK[state.level];
  const unanswered=lv.qs.filter(q=>{const s=ansOf(q);return s.value===null||s.value==='';});
  if(unanswered.length && !confirm('还有 '+unanswered.length+' 道题没有作答，未作答按错误计算。确定提交吗？')) return;

  state.submitted=true;
  state.durationSec=Math.floor((Date.now()-state.startedAt.getTime())/1000);
  let correct=0;
  state.details=lv.qs.map((q,i)=>{
    const st=ansOf(q);
    const ok=grade(q,st.value);
    if(ok) correct++;
    return {
      no:i+1, type:TYPE_NAME[q.type], stem:q.stem.replace(/［　　］/g,'____'),
      user:ansText(q,st.value), correct:correctText(q), ok,
      used:st.sec+Math.round((Date.now()-qEnterTs)/1000*(i===state.idx?1:0)),
      attempts:st.attempts, hints:st.hints
    };
  });
  state.score=correct*20;
  clearInterval(clockTimer);
  renderResult(correct);
  showScreen('screen-result');
  $('#tutorDot').classList.remove('show');
  uploadData();
}

function renderResult(correct){
  const lv=BANK[state.level];
  const percent=state.score;
  $('#scoreNum').textContent=percent;
  const arc=$('#ringArc');
  arc.style.transition='none'; arc.style.strokeDashoffset=326.7;
  requestAnimationFrame(()=>{ arc.style.transition='stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)';
    arc.style.strokeDashoffset=(326.7*(1-percent/100)).toFixed(1); });

  const praise = percent===100?'满分！光的反射这一节你拿下了 🎉'
              : percent>=80?'很不错！只差一点点细节，把错题的点拨看一遍就稳了。'
              : percent>=60?'基础还行，但易错点还需要再过一遍，建议看看下面的解析。'
              : '别灰心，先回到"三线两角"和角度换算，再练一次会好很多。';
  $('#resTitle').textContent = state.name+'，'+lv.name+'关完成';
  $('#resSub').textContent = praise;
  $('#resTags').innerHTML =
    `<span class="tag">答对 ${correct}/5 题</span>
     <span class="tag">用时 ${fmtClock(state.durationSec)}</span>
     <span class="tag ${correct>=3?'g':'r'}">得分 ${percent}</span>`;

  $('#review').innerHTML = state.details.map(d=>`
    <div class="rv-item ${d.ok?'ok':'no'}">
      <div class="rv-h">
        <span class="st ${d.ok?'ok':'no'}">${d.ok?'正确':'错误'}</span>
        <span>第 ${d.no} 题 · ${d.type}</span>
        <span style="margin-left:auto">${d.attempts?'判过 '+d.attempts+' 次':''}</span>
      </div>
      <div class="rv-stem">${esc(d.stem)}</div>
      <div class="rv-ans">你的答案：<b>${esc(d.user)}</b>　|　正确答案：<b>${esc(d.correct)}</b></div>
      <div class="rv-exp">${esc(BANK[state.level].qs[d.no-1].explain)}</div>
    </div>`).join('');
}

function buildPayload(){
  const lv=BANK[state.level];
  const text=state.details.map(d=>
    `${d.no}.【${d.type}】${d.ok?'正确':'错误'}；作答：${d.user}；答案：${d.correct}`
  ).join('  ||  ');
  return {
    source:'光的反射课后作业',
    student_name:state.name,
    student_id:state.sid,
    level:lv.name,
    difficulty:lv.key,
    score:state.score,
    correct_count:state.details.filter(d=>d.ok).length,
    question_count:5,
    accuracy:Math.round(state.details.filter(d=>d.ok).length/5*100)+'%',
    duration_sec:state.durationSec,
    duration_text:fmtClock(state.durationSec),
    started_at:fmtTime(new Date(state.startedAt)),
    submitted_at:fmtTime(new Date()),
    answers_detail:text,
    answers_json:JSON.stringify(state.details),
    assistant_msgs:state.chatCount,
    user_agent:navigator.userAgent
  };
}

async function uploadData(){
  const payload=buildPayload();
  state.lastPayload=payload;
  setUploadState('busy','正在上传答题数据…');
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),15000);
    const res=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload),
      signal:ctrl.signal
    });
    clearTimeout(timer);
    if(!res.ok) throw new Error('HTTP '+res.status);
    state.uploadOk=true;
    setUploadState('ok','答题数据已上传给老师 ✓');
    bubble('数据和老师那边同步好啦～',5000);
  }catch(err){
    state.uploadOk=false;
    setUploadState('err','上传失败，已保存在本机');
    try{
      const arr=JSON.parse(localStorage.getItem('gfse_records')||'[]');
      arr.push(payload); localStorage.setItem('gfse_records',JSON.stringify(arr.slice(-20)));
    }catch(e){}
  }
}
function setUploadState(kind,txt){
  const el=$('#uploadState');
  el.className='upload-state'+(kind==='ok'?' ok':kind==='err'?' err':'');
  $('#uploadTxt').innerHTML = txt + (kind==='err'?'　<a href="javascript:;" id="retryUp" style="color:#2f7cf6">重试</a>':'');
  const r=$('#retryUp'); if(r) r.onclick=uploadData;
}

/* 意图识别 */
function respond(text){
  const t=text.toLowerCase().replace(/\s/g,'');
  const q=BANK[state.level]?BANK[state.level].qs[state.idx]:null;
  const st=q?ansOf(q):null;

  if(/^(你好|嗨|hi|hello|在吗|小光)/.test(t)){
    return '我在呢～ 现在做的是<b>'+(q?TYPE_NAME[q.type]:'练习')+'</b>。可以让我"判一判这题"，或者点下面的小按钮。';
  }
  if(/(检查|判一|看看我|对不对|我写对|判题|批改|打分)/.test(t)){
    const r=checkCurrent(true);
    if(!r) return '这题你还没写答案呀，先选一个（或填上），我马上帮你看。';
    return r.msg;
  }
  if(/(提示|不会|没思路|怎么做|怎么想|help|hint)/.test(t)){
    if(!q) return '先选一个难度开始吧，我才能针对题目给你提示。';
    if(st) st.hints++;
    return `这题的提示：<br>${esc(q.hint)}<br><span style="color:#8b9aab;font-size:12px">只给思路，答案留给你自己写 😉</span>`;
  }
  if(/(讲|解析|为什么|解释|思路|分析)/.test(t)){
    if(!q) return '挑一道题，我就能给你讲。';
    const stt=ansOf(q);
    if(stt.checked===null) return `先自己做一次再看解析效果更好哦。<br>不过思路可以先给你：${esc(q.hint)}`;
    return `<b>第 ${state.idx+1} 题解析</b><br>${esc(q.explain)}<br><span style="color:#0e9c74;font-size:12px">一句话记住：${esc(q.tip)}</span>`;
  }
  if(/(答案|直接告诉|是几|选什么)/.test(t)){
    return '直接给答案就失去练习的意义啦 😅 我可以给你提示，或者帮你判对错。<br>要不要点"给点提示"？';
  }
  if(/(下一题|继续|下一个)/.test(t)){
    return '直接用页面下方"下一题"按钮翻页哦。做完 5 道题点"提交作业"，我来给你算分。';
  }
  if(/(交卷|提交|上传|老师)/.test(t)){
    return '点右下角"提交作业"就会自动判分，并把<b>姓名、学号、每题作答和得分</b>一起发给老师。上传成功我会告诉你。';
  }
  if(/(无聊|累|放弃|不想做|好难)/.test(t)){
    return '别急，物理题就像找规律：先把法线画出来，角一量，答案就出来了。<br>我陪你把这一题拆开看，点"给点提示"？';
  }
  if(/(谢谢|thanks|懂了|明白了)/.test(t)){
    return pick(['不客气！继续保持 💪','能自己想通最棒了～','记住这句话：角都从法线量起。']);
  }

  for(const item of KB){
    if(item.k.some(k=>t.includes(k.toLowerCase()))) return item.a;
  }
  if(q) return `这个问题我还没学会回答 🤔<br>不过关于<b>第 ${state.idx+1} 题</b>，我可以：帮你判对错、给提示、讲解析。也可以问我"法线是什么""什么是漫反射"。`;
  return '先在上面选一个难度，我们就可以开始啦～';
}

/* 交互绑定 */
$('#tutorDock').onclick=()=>{ state.chatOpen?closeChat():openChat(true); };
$('#chatClose').onclick=closeChat;
$('#chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  const act=c.dataset.act;
  const q=BANK[state.level]?BANK[state.level].qs[state.idx]:null;
  if(act==='check'){ addMsg('me','帮我判一下这题'); const r=checkCurrent(true); aiSay(r?r.msg:'这题还没写答案呢，先选一个我再帮你看～'); return; }
  if(act==='hint'){ addMsg('me','给点提示'); const st=q?ansOf(q):null; if(st) st.hints++; aiSay(q?('提示来啦：<br>'+esc(q.hint)):'先选难度开始吧～'); return; }
  if(act==='explain'){ addMsg('me','讲讲这题的思路'); aiSay(q?('<b>第 '+(state.idx+1)+' 题</b><br>'+esc(q.explain)+'<br><span style="color:#0e9c74;font-size:12px">一句话记住：'+esc(q.tip)+'</span>'):'先选一道题吧～'); return; }
  if(act==='law'){ addMsg('me','帮我背一下反射定律'); aiSay('反射定律三句话：<br>① 反射光线、入射光线、法线在<b>同一平面内</b>；<br>② 反射光线与入射光线<b>分居法线两侧</b>；<br>③ <b>反射角等于入射角</b>。<br>另外：角都从<b>法线</b>量起，反射时光路可逆。'); return; }
});
$('#chatSend').onclick=sendChat;
$('#chatInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();sendChat();} });
function sendChat(){
  const inp=$('#chatInput');
  const v=inp.value.trim(); if(!v) return;
  inp.value='';
  addMsg('me',v);
  aiSay(respond(v),560);
}

/* 离开提醒 */
window.addEventListener('beforeunload',e=>{
  if(state.startedAt && !state.submitted && $('#screen-quiz').classList.contains('show')){
    e.preventDefault(); e.returnValue='';
  }
});

/* ======================= 初始化 ======================= */
renderLevels();
$('#levels').addEventListener('click',e=>{
  const c=e.target.closest('.level-card'); if(!c) return;
  enterLevel(c.dataset.level);
});
['inpName','inpSid'].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener('input',()=>{ el.closest('.field').classList.remove('err'); });
  el.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      if(id==='inpName') $('#inpSid').focus();
      else if($('#inpSid').value.trim()) enterLevel('basic');
    }
  });
});
// 记录每题用时
setInterval(()=>{
  if(!state.level||!state.startedAt||state.submitted) return;
  if(!$('#screen-quiz').classList.contains('show')) return;
  const q=BANK[state.level].qs[state.idx]; if(!q) return;
  ansOf(q).sec=Math.round((Date.now()-qEnterTs)/1000);
},1000);

})();
</script>
</body>
</html>
